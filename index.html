<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Typing Test</title>

        <link
            rel="preload"
            href="/assets/xMQbuFFYT72XzQUpDg.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <style>
            @font-face {
                font-family: 'Sora';
                font-style: normal;
                font-weight: 100 800;
                font-display: swap;
                src: url(/assets/xMQbuFFYT72XzQUpDg.woff2) format('woff2');
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
                    U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
                    U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
        </style>
        <link
            rel="stylesheet"
            href="reset.css"
        />
        <link
            rel="stylesheet"
            href="styles.css"
        />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="wrapper">
            <header class="header">
                <div class="header__logo">
                    <h1>Typing Speed Test</h1>
                </div>
                <div class="header__record-wrapper">
                    <div class="header__record-icon">
                        <img
                            src="/assets/images/trophy.svg"
                            alt=""
                        />
                    </div>
                    <p>
                        Best score: 
                        <span class='header__record-highlight'>
                            <span cmp-best-score>92</span>
                        wpm</span>
                    </p>
                </div>
            </header>
            <main>
                <nav class="nav-bar">
                    <ul class="stats">
                        <li class="stats__item">
                            WPM:
                            <span
                                cmp-current-speed 
                                class="stats__accent"
                                >40</span
                            >
                        </li>
                        <li class="stats__item">
                            Accuracy: 
                            <span
                                cmp-current-accuracy
                                class="stats__accent"
                                >94%</span
                        </li>
                        <li class="stats__item">
                            Time: 
                            <span
                                cmp-time-left
                                class="stats__accent"
                                >0:46</span
                        </li>
                    </ul>

                    <ul class="difficulty">
                        Difficulty:
                        <li>
                            <button data-difficulty="easy" class='switch'>
                                Easy
                            </button>
                        </li>
                        <li>
                            <button data-difficulty="medium" class='switch active'>
                                Medium
                            </button>
                        </li>
                        <li>
                            <button data-difficulty="hard" class='switch'>
                                Hard
                            </button>
                        </li>
                    </ul>

                    <ul class="duration">
                        Duration:
                        <li>
                            <button data-duration="60" class='switch active'>
                                1 min
                            </button>
                        </li>
                        <li>
                            <button data-duration="180" class='switch'>
                                3 min
                            </button>
                        </li>
                        <li>
                            <button data-duration="300" class='switch'>
                                5 min
                            </button>
                        </li>
                    </ul>
                </nav>

                <article class="typing-area-wrapper">
                    <div tabindex="0" cmp-typing-area class='typing-area' style="--offset: 0;">
                        <!-- <p> -->
                        <!--     The archaeological expedition unearthed artifacts that complicated prevailing theories about Bronze Age trade networks. Obsidian from Anatolia, lapis lazuli from Afghanistan, and amber from the Baltic—all discovered in a single Mycenaean tomb—suggested commercial connections far more extensive than previously hypothesized. "We've underestimated ancient peoples' navigational capabilities and their appetite for luxury goods," the lead researcher observed. "Globalization isn't as modern as we assume." -->
                        <!-- </p> -->
                    </div>
                    <span class='pause-banner'>
                        <span>paused</span>
                    </span>
                    <div cmp-end-test class='end-test hidden'>
                        <figure class='end-test__icon'>
                            <img src="/assets/images/green-checkmark.svg" alt="">
                        </figure>
                        <h2 class='end-test__title'>Test Complete!</h2>
                        <ul class='end-test__stats'>
                            <li>
                                WPM: 
                                <span cmp-final-wpm class='end-test__stats__accent'>85</span>
                            </li>
                            <li>
                                Accuracy: 
                                <span cmp-final-accuracy class='end-test__stats__accent'>90%</span>
                            </li>
                            <li>
                                Characters: 
                                <span cmp-final-chars class='end-test__stats__accent'>1200</span>
                            </li>
                        </ul>
                    </div>
                </article>

                <footer class='footer'>
                    <button cmp-start-test-btn class='test-controls-btn'>Restart Test</button>
                </footer>
            </main>
        </div>
        <div cmp-toast class='toast'>CapsLock is on!</div>
    </body>
</html>
